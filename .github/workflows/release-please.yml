name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: go
          # PAT (not GITHUB_TOKEN): tags created with GITHUB_TOKEN
          # do not trigger the GoReleaser workflow below.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
